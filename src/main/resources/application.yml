server:
  port: 8083

spring:
  application:
    name: account-patrol
  cloud:
    nacos:
      discovery:
        # 服务发现接线（rcp-contracts/docs/DISCOVERY.md）：占位符默认值命中部署侧
        # Service 名（compose 服务名与 K8s Service 名均为 nacos），部署侧无需注入。
        server-addr: ${NACOS_SERVER:nacos:8848}
        namespace: ${NACOS_NAMESPACE:risk-control}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

patrol:
  account:
    # 虚拟号段 + 同设备账号数达到该值 -> BAN（确定性设备农场）
    virtual-segment-device-count: 3
    # 同设备账号数达到该值 -> BAN
    same-device-ban-count: 5
    # 同 IP 24h 注册达到该值 -> INTERCEPT
    same-ip-intercept-count: 10
    # 夜间(0-6点) + 同 IP 注册达到该值 -> EXTRA_REVIEW
    same-ip-night-count: 5
    # 24h 发帖达到该值 -> LIMIT（养号特征）
    post-limit-count: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
